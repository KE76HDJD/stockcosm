version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: gestion_stock_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestion_stock_cosmetiques
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yaokouma
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestion_stock_cosmetiques"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
